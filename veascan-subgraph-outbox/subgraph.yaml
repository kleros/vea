      startBlock: 6636625
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Challenged
        - Claimed
        - MessageRelayed
        - Verified
      abis:
        - name: VeaOutboxArbToEthTestnet
