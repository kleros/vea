name: Veashi Contracts
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev
    paths:
      - "veashi-contracts/**"
      - ".github/workflows/veashi-contracts.yml"
  pull_request:
    paths:
      - "veashi-contracts/**"
      - ".github/workflows/veashi-contracts.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      # Node from the root package.json Volta pin.
      - name: Setup Node.js environment
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: package.json

      # Yarn from the root package.json packageManager field.
      - name: Enable Corepack
        run: corepack enable

      # The build resolves solidity-rlp and OpenZeppelin from ../node_modules (veashi-contracts/remappings.txt).
      # It needs only their sources, so no package install script runs (--mode=skip-build).
      - name: Install workspace dependencies
        run: yarn install --immutable --mode=skip-build
        env:
          HUSKY: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5

      - name: Forge build
        run: forge build
        working-directory: veashi-contracts

      - name: Forge test
        run: forge test -vvv
        working-directory: veashi-contracts
