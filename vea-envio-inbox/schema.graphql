# Shared by both entity families below.
type Inbox {
  id: ID!
}

# --- relayer-facing (used by relayer-cli) ---

type Sender {
  id: ID!
}

type Receiver {
  id: ID!
}

type MerkleNode {
  id: ID!
  hash: String!
}

type MessageSent {
  id: ID!
  inbox: Inbox!
  nonce: BigInt!
  to: Receiver!
  msgSender: Sender!
  data: String!
  node: MerkleNode!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
}

type SnapshotSaved {
  id: ID!
  inbox: Inbox!
  caller: String
  txHash: String
  stateRoot: String!
  epoch: BigInt!
  count: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
}

# --- validator/explorer-facing (used by validator-cli) ---

type Snapshot {
  id: ID!
  inbox: Inbox!
  epoch: BigInt
  caller: String
  txHash: String
  timestamp: BigInt
  stateRoot: String
  messages: [Message!]! @derivedFrom(field: "snapshot")
  numberMessages: BigInt!
  saved: Boolean!
  resolving: Boolean!
  fallback: [Fallback!]! @derivedFrom(field: "snapshot")
}

type Message {
  id: ID!
  inbox: Inbox!
  txHash: String!
  timestamp: BigInt!
  from: String!
  to: String!
  snapshot: Snapshot!
  data: String!
}

type Fallback {
  id: ID!
  snapshot: Snapshot!
  executor: String!
  timestamp: BigInt
  txHash: String!
  ticketId: String!
}

type Ref {
  id: ID!
  inbox: Inbox!
  currentSnapshotIndex: BigInt!
}
