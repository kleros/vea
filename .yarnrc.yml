compressionLevel: mixed

enableGlobalCache: false

# Only link workspaces through the explicit `workspace:` protocol. This lets
# veashi-scanner consume @kleros/veashi-sdk from the npm registry (prebuilt
# dist) instead of the local, unbuilt workspace — required for CI/Netlify.
enableTransparentWorkspaces: false

enableTelemetry: 0

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.6.0.cjs
