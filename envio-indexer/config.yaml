# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: envio-indexer
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: VeaInboxArbToEth
    handler: src/handlers/inbox.ts
    events:
      - event: MessageSent(bytes _nodeData)
      - event: SnapshotSaved(bytes32 _snapshot, uint256 _epoch, uint64 _count)
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: SnapshotSent(uint256 indexed _epochSent, bytes32 _ticketId)
        field_selection:
          transaction_fields:
            - hash
            - from
  - name: VeaOutbox
    handler: src/handlers/outbox.ts
    events:
      - event: Claimed(address indexed _claimer, uint256 indexed _epoch, bytes32 _stateRoot)
      - event: Challenged(uint256 indexed _epoch, address indexed _challenger)
      - event: VerificationStarted(uint256 indexed _epoch)
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: Verified(uint256 _epoch)
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: MessageRelayed(uint64 _msgId)
        field_selection:
          transaction_fields:
            - hash
            - from
  - name: Yaho
    abi_file_path: ./abis/Yaho.json
    handler: src/handlers/yaho.ts
    events:
      - event: MessageDispatched
chains:
  # ---------------------------------------------------------------------------
  # Chain `start_block` is the earliest deployment on that chain. Where a chain
  # carries several contracts deployed at different times, the later ones set
  # their own `start_block` so nothing is scanned before it exists.
  # Yaho addresses come from veashi-sdk/addresses/<src>-<dst>.json (one Yaho
  # per source chain per route; routes sharing a deployment are listed once).
  # ---------------------------------------------------------------------------

